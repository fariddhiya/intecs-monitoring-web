services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intecs
      POSTGRES_PASSWORD: intecs123
      POSTGRES_DB: intecs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intecs"]
      interval: 10s
      timeout: 5s
      retries: 5

  hivemq:
    image: hivemq/hivemq4:latest
    environment:
      HIVEMQ_ALLOW_ALL_CLIENTS: "false"
    ports:
      - "1883:1883"
      - "8888:8888"
      - "8000:8000"
      - "9091:8080"
    volumes:
      - ./hivemq-entrypoint.sh:/setup/setup.sh:ro
    command: ["/bin/bash", "/setup/setup.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v2/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://intecs:intecs123@postgres:5432/intecs?sslmode=disable
      MQTT_BROKER_URL: tcp://hivemq:1883
      MQTT_USERNAME: intecs
      MQTT_PASSWORD: intecs123
      DEVICE_COUNT: "10"
      PUBLISH_INTERVAL: 5s
      SITE_ID: sangatta
      HIGH_TEMP_THRESHOLD: "90"
    depends_on:
      postgres:
        condition: service_healthy
      hivemq:
        condition: service_started
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      MQTT_BROKER_URL: tcp://hivemq:1883
      MQTT_USERNAME: intecs
      MQTT_PASSWORD: intecs123
      DEVICE_COUNT: "10"
      PUBLISH_INTERVAL: 5s
      SITE_ID: sangatta
    depends_on:
      hivemq:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intecs
      POSTGRES_PASSWORD: intecs123
      POSTGRES_DB: intecs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intecs"]
      interval: 10s
      timeout: 5s
      retries: 5

  hivemq:
    image: hivemq/hivemq4:latest
    ports:
      - "1883:1883"
      - "8888:8888"
      - "8000:8000"
      - "9090:9090"
    environment:
      HIVEMQ_AUTHENTICATION_PLUGIN_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://intecs:intecs123@postgres:5432/intecs?sslmode=disable
      MQTT_BROKER_URL: tcp://hivemq:1883
      MQTT_USERNAME: intecs
      MQTT_PASSWORD: intecs123
      DEVICE_COUNT: "10"
      PUBLISH_INTERVAL: 5s
      SITE_ID: sangatta
      HIGH_TEMP_THRESHOLD: "90"
    depends_on:
      postgres:
        condition: service_healthy
      hivemq:
        condition: service_started
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      MQTT_BROKER_URL: tcp://hivemq:1883
      MQTT_USERNAME: intecs
      MQTT_PASSWORD: intecs123
      DEVICE_COUNT: "10"
      PUBLISH_INTERVAL: 5s
      SITE_ID: sangatta
    depends_on:
      hivemq:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
